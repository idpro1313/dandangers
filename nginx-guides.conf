# Конфигурация Nginx для динамических гайдов
# Добавьте этот блок в ваш nginx.conf внутри блока server {}

# Rewrite guide-*.html на guide.php
location ~ ^/guide-([a-z]+)\.html$ {
    # Передаём slug гайда как параметр page
    rewrite ^/guide-([a-z]+)\.html$ /guide.php?page=$1 last;
}

# Обработка PHP файлов (если ещё не настроено)
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass php:9000;  # или unix:/var/run/php/php-fpm.sock
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}

