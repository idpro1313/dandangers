server {
    listen 80;
    server_name dandangers.ru www.dandangers.ru;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Кодировка
    charset utf-8;

    # Gzip сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ===== ЕДИНЫЙ РОУТЕР: index.php =====
    
    # Гайды: guide-*.html -> index.php?route=guide&page=*
    location ~ ^/guide-([a-z0-9-]+)\.html$ {
        rewrite ^/guide-([a-z0-9-]+)\.html$ /index.php?route=guide&page=$1 last;
    }
    
    # LootBar: lootbar-*.html -> index.php?route=lootbar&page=*
    location ~ ^/lootbar-([a-z0-9-]+)\.html$ {
        rewrite ^/lootbar-([a-z0-9-]+)\.html$ /index.php?route=lootbar&page=$1 last;
    }
    
    # Расписание: daily.html -> index.php?route=schedule&page=daily
    location = /daily.html {
        rewrite ^ /index.php?route=schedule&page=daily last;
    }
    
    # ===== LEGACY REDIRECTS (старые URL) =====
    
    # Старые гайды
    location = /17sovetov.html {
        rewrite ^ /index.php?route=guide&page=17sovetov last;
    }
    location = /bigguide.html {
        rewrite ^ /index.php?route=guide&page=bigguide last;
    }
    location = /fullguide.html {
        rewrite ^ /index.php?route=guide&page=fullguide last;
    }
    location = /heroes.html {
        rewrite ^ /index.php?route=guide&page=heroes-old last;
    }
    location = /lab.html {
        rewrite ^ /index.php?route=guide&page=lab-old last;
    }
    location = /res.html {
        rewrite ^ /index.php?route=guide&page=res-old last;
    }
    location = /main.html {
        rewrite ^ /index.php?route=guide&page=soyuz-dangers last;
    }
    location = /novoe.html {
        rewrite ^ /index.php?route=guide&page=biblioteka last;
    }
    
    # Старые lootbar URL
    location = /lootbar.html {
        rewrite ^ /index.php?route=lootbar&page=discounts last;
    }

    # ===== ОСНОВНЫЕ СТРАНИЦЫ =====
    location / {
        try_files $uri $uri/ =404;
    }

    # ===== PHP ОБРАБОТКА =====
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # ===== ЗАЩИТА ФАЙЛОВ =====

    # Конфигурационные файлы
    location = /admin-config.php { deny all; return 404; }
    location = /admin-password.php { deny all; return 404; }
    location = /guides-config.php { deny all; return 404; }
    location = /lootbar-config.php { deny all; return 404; }
    location = /schedule-config.php { deny all; return 404; }
    location = /admin-changes.log { deny all; return 404; }

    # Папки с данными
    location /backups/ { deny all; return 404; }
    location /content/guides/ { deny all; return 404; }
    location /content/schedule/ { deny all; return 404; }
    location /lib/ { deny all; return 404; }
    location /docker/ { deny all; return 404; }
    
    # Изображения LootBar - разрешить
    location ~* ^/content/lootbar/.*\.(png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # MD файлы LootBar - запретить
    location ~* ^/content/lootbar/.*\.md$ { deny all; return 404; }

    # ===== СТАТИКА =====
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Служебные файлы
    location ~ /\. { deny all; }
    location ~* \.(bak|log|old|orig|tmp|md)$ { deny all; return 404; }
}
