server {
    listen 80;
    server_name dandangers.ru www.dandangers.ru;
    root /usr/share/nginx/html;

    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ===== ТОЧНЫЕ СОВПАДЕНИЯ (высший приоритет) =====
    
    # Главная страница
    location = / {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING route=home;
    }
    
    # Расписание
    location = /daily.html {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING route=schedule&page=daily;
    }
    
    # Запрет прямого доступа к index.php
    location = /index.php {
        return 404;
    }

    # ===== LEGACY REDIRECTS (301) =====
    location = /index.html { return 301 /; }
    location = /admin.html { return 301 /admin.php; }
    location = /17sovetov.html { return 301 /guide-17sovetov.html; }
    location = /bigguide.html { return 301 /guide-bigguide.html; }
    location = /fullguide.html { return 301 /guide-fullguide.html; }
    location = /heroes.html { return 301 /guide-heroes-old.html; }
    location = /lab.html { return 301 /guide-lab-old.html; }
    location = /res.html { return 301 /guide-res-old.html; }
    location = /main.html { return 301 /guide-soyuz-dangers.html; }
    location = /novoe.html { return 301 /guide-biblioteka.html; }
    location = /lootbar.html { return 301 /lootbar-discounts.html; }

    # ===== ЗАЩИТА ФАЙЛОВ (prefix с ^~ для приоритета над regex) =====
    location ^~ /backups/ { return 404; }
    location ^~ /content/guides/ { return 404; }
    location ^~ /content/schedule/ { return 404; }
    location ^~ /lib/ { return 404; }
    location ^~ /docker/ { return 404; }

    # ===== ДИНАМИЧЕСКИЕ СТРАНИЦЫ (regex) =====
    
    # Гайды: /guide-*.html -> PHP
    location ~ ^/guide-([a-z0-9-]+)\.html$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING route=guide&page=$1;
    }
    
    # LootBar: /lootbar-*.html -> PHP
    location ~ ^/lootbar-([a-z0-9-]+)\.html$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING route=lootbar&page=$1;
    }

    # ===== PHP ФАЙЛЫ (admin.php, admin-api.php) =====
    location ~ \.php$ {
        # Запрет конфигурационных файлов
        location ~ (-config|-password)\.php$ { return 404; }
        
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # ===== ИЗОБРАЖЕНИЯ LOOTBAR =====
    location ~ ^/content/lootbar/.*\.(png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "index, follow";
    }
    
    # MD файлы LootBar - запретить
    location ~ ^/content/lootbar/.*\.md$ { return 404; }

    # ===== СТАТИЧЕСКИЕ ФАЙЛЫ =====
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ===== ЗАПРЕТ СЛУЖЕБНЫХ ФАЙЛОВ =====
    location ~ /\. { return 404; }
    location ~* \.(bak|log|old|orig|tmp|md)$ { return 404; }
    location = /admin-changes.log { return 404; }

    # ===== CATCH-ALL ДЛЯ ОСТАЛЬНЫХ ФАЙЛОВ =====
    location / {
        try_files $uri $uri/ =404;
    }
}
