server {
    listen 80;
    server_name dandangers.ru www.dandangers.ru;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Кодировка
    charset utf-8;

    # Gzip сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ===== ГАЙДЫ (MD -> PHP) =====
    # Rewrite guide-*.html на guide.php (ВАЖНО: должно быть ПЕРЕД другими location)
    location ~ ^/guide-([a-z0-9-]+)\.html$ {
        rewrite ^/guide-([a-z0-9-]+)\.html$ /guide.php?page=$1 last;
    }
    
    # Старые гайды - редирект на новые URL
    location = /17sovetov.html {
        rewrite ^ /guide.php?page=17sovetov last;
    }
    location = /bigguide.html {
        rewrite ^ /guide.php?page=bigguide last;
    }
    location = /fullguide.html {
        rewrite ^ /guide.php?page=fullguide last;
    }
    location = /heroes.html {
        rewrite ^ /guide.php?page=heroes-old last;
    }
    location = /lab.html {
        rewrite ^ /guide.php?page=lab-old last;
    }
    location = /res.html {
        rewrite ^ /guide.php?page=res-old last;
    }
    
    # ===== LOOTBAR (MD -> PHP) =====
    # Rewrite lootbar-*.html на lootbar.php
    location ~ ^/lootbar-([a-z0-9-]+)\.html$ {
        rewrite ^/lootbar-([a-z0-9-]+)\.html$ /lootbar.php?page=$1 last;
    }
    
    # Старые lootbar URL - редирект
    location = /lootbar.html {
        rewrite ^ /lootbar.php?page=discounts last;
    }
    location = /lootbar-instruction.html {
        rewrite ^ /lootbar.php?page=instruction last;
    }
    
    # ===== РАСПИСАНИЕ (MD -> PHP) =====
    # daily.html -> schedule.php
    location = /daily.html {
        rewrite ^ /schedule.php?page=daily last;
    }

    # Основные страницы
    location / {
        try_files $uri $uri/ =404;
    }

    # ===== АДМИН-ПАНЕЛЬ =====
    
    # PHP обработка для API админки и гайдов
    location ~ \.php$ {
        # Проверяем что файл существует
        try_files $uri =404;
        
        # FastCGI к PHP-FPM контейнеру
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Таймауты
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # ===== ЗАЩИТА ФАЙЛОВ =====

    # Защита конфигурационных файлов
    location = /admin-config.php {
        deny all;
        return 404;
    }

    # Защита файла пароля
    location = /admin-password.php {
        deny all;
        return 404;
    }

    # Защита guides-config.php
    location = /guides-config.php {
        deny all;
        return 404;
    }

    # Защита lootbar-config.php
    location = /lootbar-config.php {
        deny all;
        return 404;
    }

    # Защита schedule-config.php
    location = /schedule-config.php {
        deny all;
        return 404;
    }

    # Защита логов
    location = /admin-changes.log {
        deny all;
        return 404;
    }

    # Защита папки с бэкапами
    location /backups/ {
        deny all;
        return 404;
    }

    # Защита папки content/guides (MD файлы)
    location /content/guides/ {
        deny all;
        return 404;
    }
    
    # Защита папки content/schedule (MD файлы)
    location /content/schedule/ {
        deny all;
        return 404;
    }
    
    # Разрешить изображения из content/lootbar
    location ~* ^/content/lootbar/.*\.(png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Защита MD файлов в content/lootbar
    location ~* ^/content/lootbar/.*\.md$ {
        deny all;
        return 404;
    }

    # Защита папки lib (Parsedown)
    location /lib/ {
        deny all;
        return 404;
    }

    # Защита папки docker (конфигурации)
    location /docker/ {
        deny all;
        return 404;
    }

    # ===== СТАТИКА =====

    # Кэширование статики
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML без долгого кэша (для обновлений)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Запрет доступа к служебным файлам
    location ~ /\. {
        deny all;
    }

    location ~* \.(bak|log|old|orig|tmp|md)$ {
        deny all;
        return 404;
    }
}
