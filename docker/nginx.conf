server {
    listen 80;
    server_name dandangers.ru www.dandangers.ru;
    root /usr/share/nginx/html;

    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ===== ГЛАВНАЯ СТРАНИЦА =====
    location = / {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING route=home;
        include fastcgi_params;
    }

    # ===== ГАЙДЫ: guide-*.html =====
    location ~ ^/guide-([a-z0-9-]+)\.html$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING route=guide&page=$1;
        include fastcgi_params;
    }
    
    # ===== LOOTBAR: lootbar-*.html =====
    location ~ ^/lootbar-([a-z0-9-]+)\.html$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING route=lootbar&page=$1;
        include fastcgi_params;
    }
    
    # ===== РАСПИСАНИЕ: daily.html =====
    location = /daily.html {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING route=schedule&page=daily;
        include fastcgi_params;
    }
    
    # ===== LEGACY REDIRECTS (301) =====
    location = /index.html { return 301 /; }
    location = /admin.html { return 301 /admin.php; }
    location = /17sovetov.html { return 301 /guide-17sovetov.html; }
    location = /bigguide.html { return 301 /guide-bigguide.html; }
    location = /fullguide.html { return 301 /guide-fullguide.html; }
    location = /heroes.html { return 301 /guide-heroes-old.html; }
    location = /lab.html { return 301 /guide-lab-old.html; }
    location = /res.html { return 301 /guide-res-old.html; }
    location = /main.html { return 301 /guide-soyuz-dangers.html; }
    location = /novoe.html { return 301 /guide-biblioteka.html; }
    location = /lootbar.html { return 301 /lootbar-discounts.html; }

    # ===== ИЗОБРАЖЕНИЯ КОНТЕНТА (разрешены для индексации) =====
    location ~* ^/content/lootbar/.*\.(png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "index, follow";
    }

    # ===== СТАТИЧЕСКИЕ ФАЙЛЫ =====
    location / {
        try_files $uri $uri/ =404;
    }

    # ===== ЗАПРЕТ ПРЯМОГО ДОСТУПА К index.php =====
    location = /index.php {
        deny all;
        return 404;
    }

    # ===== PHP (admin.php и admin-api.php) =====
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # ===== ЗАЩИТА КОНФИГУРАЦИОННЫХ ФАЙЛОВ =====
    location ~* -config\.php$ { deny all; return 404; }
    location ~* -password\.php$ { deny all; return 404; }
    location = /admin-changes.log { deny all; return 404; }
    
    # ===== ЗАЩИТА СЛУЖЕБНЫХ ПАПОК =====
    location /backups/ { deny all; return 404; }
    location /content/guides/ { deny all; return 404; }
    location /content/schedule/ { deny all; return 404; }
    location /lib/ { deny all; return 404; }
    location /docker/ { deny all; return 404; }
    
    # MD файлы LootBar - запретить прямой доступ
    location ~* ^/content/lootbar/.*\.md$ { deny all; return 404; }

    # ===== КЭШИРОВАНИЕ СТАТИКИ =====
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== ЗАПРЕТ СЛУЖЕБНЫХ ФАЙЛОВ =====
    location ~ /\. { deny all; }
    location ~* \.(bak|log|old|orig|tmp)$ { deny all; return 404; }
    
    # MD файлы в корне - запретить (контент доступен через HTML-страницы)
    location ~* \.md$ { deny all; return 404; }
}
