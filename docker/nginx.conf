server {
    listen 80;
    server_name dandangers.ru www.dandangers.ru;
    root /usr/share/nginx/html;

    charset utf-8;

    # ===== GZIP COMPRESSION =====
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # ===== SECURITY HEADERS =====
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== ЗАЩИТА ПАПОК =====
    location ^~ /backups/ { return 404; }
    location ^~ /content/guides/ { return 404; }
    location ^~ /content/schedule/ { return 404; }
    location ^~ /lib/ { return 404; }
    location ^~ /docker/ { return 404; }

    # ===== REDIRECTS =====
    location = /index.html { return 301 /; }
    location = /admin.html { return 301 /admin.php; }
    
    # ===== СТАРЫЕ URL С /ru/ ПРЕФИКСОМ =====
    location = /ru/daily { return 301 /daily.html; }
    location = /ru/heroes { return 301 /guide-heroes-old.html; }
    location = /ru/17sovetov { return 301 /guide-17sovetov.html; }
    location = /ru/bigguide { return 301 /guide-bigguide.html; }
    location = /ru/fullguide { return 301 /guide-fullguide.html; }
    location = /ru/lab { return 301 /guide-lab-old.html; }
    location = /ru/res { return 301 /guide-res-old.html; }
    location = /ru/main { return 301 /; }
    location = /ru/index { return 301 /; }
    location = /ru/tabl { return 301 /daily.html; }
    location = /ru/lootbar { return 301 /lootbar-discounts.html; }
    location = /ru/novoe { return 301 /guide-biblioteka.html; }
    location = /ru/vvedenie { return 301 /guide-vvedenie.html; }
    location = /ru/razvitie { return 301 /guide-razvitie.html; }
    location = /ru/zdaniya { return 301 /guide-zdaniya.html; }
    location = /ru/laboratoriya { return 301 /guide-laboratoriya.html; }
    location = /ru/geroi { return 301 /guide-geroi.html; }
    location = /ru/snariazhenie { return 301 /guide-snariazhenie.html; }
    location = /ru/resursy { return 301 /guide-resursy.html; }
    location = /ru/sobytiya { return 301 /guide-sobytiya.html; }
    location = /ru/soyuz { return 301 /guide-soyuz.html; }
    location = /ru/mehaniki { return 301 /guide-mehaniki.html; }
    location = /ru/start { return 301 /guide-start.html; }
    location = /ru/vip { return 301 /guide-vip.html; }
    location = /ru/raspisanie { return 301 /guide-raspisanie.html; }
    location = /ru/oshibki { return 301 /guide-oshibki.html; }
    location = /ru/cheklista { return 301 /guide-cheklista.html; }
    location = /ru/glossariy { return 301 /guide-glossariy.html; }
    location = /ru/tablicy { return 301 /guide-tablicy.html; }
    location = /ru/faq { return 301 /guide-faq.html; }
    
    # ===== СТАРЫЕ HTML ФАЙЛЫ (БЕЗ guide- ПРЕФИКСА) =====
    location = /heroes.html { return 301 /guide-heroes-old.html; }
    location = /fullguide.html { return 301 /guide-fullguide.html; }
    location = /bigguide.html { return 301 /guide-bigguide.html; }
    location = /lab.html { return 301 /guide-lab-old.html; }
    location = /res.html { return 301 /guide-res-old.html; }
    location = /17sovetov.html { return 301 /guide-17sovetov.html; }
    location = /main.html { return 301 /; }
    location = /novoe.html { return 301 /guide-biblioteka.html; }
    location = /tabl.html { return 301 /daily.html; }
    location = /lootbar.html { return 301 /lootbar-discounts.html; }
    location = /lootbar-banner-test.html { return 301 /lootbar-discounts.html; }
    
    # ===== БЕЗ РАСШИРЕНИЯ .html =====
    location = /daily { return 301 /daily.html; }
    location = /heroes { return 301 /guide-heroes-old.html; }
    location = /fullguide { return 301 /guide-fullguide.html; }
    location = /bigguide { return 301 /guide-bigguide.html; }
    location = /lab { return 301 /guide-lab-old.html; }
    location = /res { return 301 /guide-res-old.html; }
    location = /17sovetov { return 301 /guide-17sovetov.html; }
    location = /main { return 301 /; }
    location = /novoe { return 301 /guide-biblioteka.html; }
    location = /tabl { return 301 /daily.html; }
    location = /lootbar { return 301 /lootbar-discounts.html; }
    
    # ===== FAVICON =====
    location = /favicon.ico { return 301 /dangers.jpg; }

    # ===== ИЗОБРАЖЕНИЯ LOOTBAR =====
    location ~ ^/content/lootbar/.*\.(png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== SEO ФАЙЛЫ =====
    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    
    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ===== СТАТИЧЕСКИЕ ФАЙЛЫ =====
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ===== ЗАПРЕТ СЛУЖЕБНЫХ ФАЙЛОВ =====
    location ~ \.md$ { return 404; }
    location ~ (-config|-password)\.php$ { return 404; }
    location = /admin-changes.log { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(bak|log|old|orig|tmp)$ { return 404; }

    # ===== ADMIN PHP =====
    location = /admin.php {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/admin.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param SERVER_NAME $server_name;
    }

    location = /admin-api.php {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/admin-api.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param SERVER_NAME $server_name;
    }

    # ===== ВСЕ ОСТАЛЬНОЕ -> index.php =====
    location / {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param SERVER_NAME $server_name;
    }
}
