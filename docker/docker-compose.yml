version: '3.8'

# Структура на сервере:
# /var/static-site/site/          <- файлы сайта
# /var/static-site/site/docker/   <- этот docker-compose.yml

services:
  caddy:
    image: caddy:alpine
    container_name: static_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - static-net

  web:
    image: nginx:alpine
    container_name: static_web
    restart: unless-stopped
    volumes:
      - ../:/usr/share/nginx/html         # Папка сайта на уровень выше
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - static-net

  updater:
    image: alpine:latest
    container_name: static_updater
    volumes:
      - ../:/site                         # Папка сайта на уровень выше
      - ./update.sh:/update.sh:ro
    command: >
      sh -c "
        apk add --no-cache git &&
        cd /site &&
        if [ ! -d .git ]; then
          git clone https://github.com/idpro1313/dandangers.git .;
        fi &&
        sh /update.sh
      "
    restart: unless-stopped
    networks:
      - static-net

  php:
    image: php:8.2-fpm-alpine
    container_name: static_php
    restart: unless-stopped
    volumes:
      - ../:/usr/share/nginx/html         # Папка сайта на уровень выше
    networks:
      - static-net

volumes:
  caddy_data:
  caddy_config:

networks:
  static-net:
    driver: bridge