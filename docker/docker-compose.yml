version: '3.8'

# Структура на сервере:
# /var/static-site/site/          <- файлы сайта
# /var/static-site/site/docker/   <- этот docker-compose.yml

services:
  web:
    image: nginx:alpine
    container_name: static_web
    restart: unless-stopped
    volumes:
      - ../:/usr/share/nginx/html         # Папка сайта на уровень выше
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - wiki_wiki-net

  updater:
    image: alpine:latest
    container_name: static_updater
    networks:
      - wiki_wiki-net
    volumes:
      - ../:/site                         # Папка сайта на уровень выше
      - ./update.sh:/update.sh:ro
    command: >
      sh -c "
        apk add --no-cache git &&
        cd /site &&
        if [ ! -d .git ]; then
          git clone https://github.com/idpro1313/dandangers.git .;
        fi &&
        sh /update.sh
      "
    restart: unless-stopped

  php:
    image: php:8.2-fpm-alpine
    container_name: static_php
    restart: unless-stopped
    volumes:
      - ../:/usr/share/nginx/html         # Папка сайта на уровень выше
    networks:
      - wiki_wiki-net

networks:
  wiki_wiki-net:
    external: true
    name: wiki_wiki-net