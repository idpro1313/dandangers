# Docker Compose для сайта dandangers.ru за Traefik (без Caddy).
# Требуется внешняя сеть: docker network create web
# См. DEPLOY-TRAEFIK.md и https://github.com/idpro1313/webserver

services:
  web:
    image: nginx:alpine
    container_name: ${SITE_CONTAINER_NAME:-dandangers_web}
    restart: unless-stopped
    volumes:
      - ${SITE_ROOT}:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.rule=${TRAEFIK_RULE}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.service=${TRAEFIK_ROUTER}-svc"
      - "traefik.http.services.${TRAEFIK_ROUTER}-svc.loadbalancer.server.port=80"

  php:
    image: php:8.2-fpm-alpine
    container_name: ${PHP_CONTAINER_NAME:-dandangers_php}
    restart: unless-stopped
    volumes:
      - ${SITE_ROOT}:/usr/share/nginx/html
    networks:
      - web

networks:
  web:
    external: true
