<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ-панель | Tiles Survive Wiki</title>
  
  <!-- Quill Editor -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  
  <!-- Стили сайта для редактора -->
  <link rel="stylesheet" href="modern-styles.css" id="siteStyles">
  
  <style>
    /* Переопределяем переменные сайта для админки */
    :root {
      --primary: #ff9800 !important;
      --primary-dark: #e65100 !important;
      --bg-dark: #0d1117;
      --bg-card: #161b22;
      --bg-elevated: #21262d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --border: #30363d;
      --success: #238636;
      --danger: #da3633;
    }
    
    /* Сброс стилей сайта для админки */
    body.admin-body {
      background: var(--bg-dark) !important;
      color: var(--text-primary) !important;
    }
    
    body.admin-body .site-nav,
    body.admin-body .site-footer,
    body.admin-body .promo-banner,
    body.admin-body main:not(.editor-area) {
      display: none !important;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
    }
    
    /* Login Screen */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    
    .login-box h1 {
      text-align: center;
      margin-bottom: 30px;
      color: var(--primary);
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 16px;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      width: 100%;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
    }
    
    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    
    .btn-success {
      background: var(--success);
      color: white;
    }
    
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    
    .error-message {
      color: var(--danger);
      text-align: center;
      margin-top: 15px;
    }
    
    /* Admin Panel */
    .admin-panel {
      display: none;
    }
    
    .admin-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .admin-header h1 {
      font-size: 20px;
      color: var(--primary);
    }
    
    .admin-header .user-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .admin-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 65px);
    }
    
    /* Sidebar */
    .sidebar {
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
    }
    
    .sidebar h2 {
      font-size: 14px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
    
    .file-list {
      list-style: none;
    }
    
    .file-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .file-item:hover {
      background: var(--bg-elevated);
    }
    
    .file-item.active {
      background: var(--primary);
      color: white;
    }
    
    .file-item .file-icon {
      font-size: 18px;
    }
    
    .file-item .file-info {
      flex: 1;
      min-width: 0;
    }
    
    .file-item .file-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .file-item .file-date {
      font-size: 11px;
      color: var(--text-secondary);
    }
    
    .file-item.active .file-date {
      color: rgba(255, 255, 255, 0.7);
    }
    
    /* Editor Area */
    .editor-area {
      padding: 24px;
      overflow-y: auto;
    }
    
    .editor-toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .editor-container {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    #editor {
      min-height: 500px;
      font-size: 16px;
    }
    
    .ql-toolbar {
      border: none !important;
      border-bottom: 1px solid #e0e0e0 !important;
      background: #f5f5f5;
    }
    
    .ql-container {
      border: none !important;
      font-family: inherit;
    }
    
    /* Редактор с поддержкой стилей сайта */
    .ql-editor {
      padding: 24px;
      color: #1a1a1a !important;
      background: #f8f9fa !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
    }
    
    /* Базовые элементы */
    .ql-editor h1 { font-size: 2em; margin-bottom: 0.5em; color: #1a1a1a; font-weight: 700; }
    .ql-editor h2 { font-size: 1.5em; margin-bottom: 0.5em; color: #1a1a1a; font-weight: 600; border-bottom: 2px solid #ff9800; padding-bottom: 0.3em; }
    .ql-editor h3 { font-size: 1.25em; margin-bottom: 0.5em; color: #1a1a1a; font-weight: 600; }
    .ql-editor p { margin-bottom: 1em; color: #1a1a1a; }
    .ql-editor ul, .ql-editor ol { margin-bottom: 1em; padding-left: 2em; color: #1a1a1a; }
    .ql-editor li { color: #1a1a1a; margin-bottom: 0.5em; }
    .ql-editor a { color: #ff9800; text-decoration: none; }
    .ql-editor a:hover { text-decoration: underline; }
    .ql-editor strong { color: #1a1a1a; font-weight: 600; }
    .ql-editor hr { border: none; border-top: 1px solid #ddd; margin: 1.5em 0; }
    
    .ql-editor blockquote { 
      border-left: 4px solid #ff9800; 
      padding: 12px 16px;
      margin: 1em 0;
      background: rgba(255, 152, 0, 0.1);
      color: #333;
      border-radius: 0 8px 8px 0;
    }
    
    .ql-editor pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Fira Code', monospace;
    }
    
    .ql-editor table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
    }
    
    .ql-editor th, .ql-editor td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    
    .ql-editor th {
      background: #ff9800;
      color: white;
      font-weight: 600;
    }
    
    .ql-editor tr:nth-child(even) {
      background: #f5f5f5;
    }
    
    /* Placeholder text */
    .ql-editor.ql-blank::before {
      color: #999;
    }
    
    /* Breadcrumb в редакторе */
    .ql-editor .breadcrumb {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 1.5em;
    }
    
    .ql-editor .breadcrumb a {
      color: #ff9800;
    }
    
    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }
    
    .status-dot.unsaved {
      background: var(--primary);
    }
    
    /* Toast Notifications */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
    }
    
    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-top: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }
    
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.info { border-left: 4px solid var(--primary); }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }
    
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal h2 {
      margin-bottom: 20px;
    }
    
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    
    .backup-list {
      max-height: 300px;
      overflow-y: auto;
    }
    
    .backup-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    
    .backup-item:hover {
      background: var(--bg-elevated);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .admin-container {
        grid-template-columns: 1fr;
      }
      
      .sidebar {
        display: none;
        position: fixed;
        top: 65px;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 99;
      }
      
      .sidebar.open {
        display: block;
      }
    }
    
    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    
    .empty-state .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="admin-body">

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🔐 Админ-панель</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль" required>
      </div>
      <button type="submit" class="btn btn-primary">Войти</button>
      <p class="error-message" id="loginError" style="display: none;"></p>
    </form>
  </div>
</div>

<!-- Admin Panel -->
<div class="admin-panel" id="adminPanel">
  <header class="admin-header">
    <h1>📝 Редактор страниц</h1>
    <div class="user-actions">
      <button class="btn btn-secondary" onclick="showBackups()">📦 Резервные копии</button>
      <button class="btn btn-secondary" onclick="previewPage()">👁 Предпросмотр</button>
      <button class="btn btn-danger" onclick="logout()">Выйти</button>
    </div>
  </header>
  
  <div class="admin-container">
    <aside class="sidebar" id="sidebar">
      <h2>📁 Файлы</h2>
      <ul class="file-list" id="fileList">
        <li class="loading"><div class="spinner"></div></li>
      </ul>
    </aside>
    
    <main class="editor-area">
      <div id="editorPlaceholder" class="empty-state">
        <div class="icon">📄</div>
        <h2>Выберите файл для редактирования</h2>
        <p>Выберите страницу из списка слева</p>
      </div>
      
      <div id="editorWrapper" style="display: none;">
        <div class="editor-toolbar">
          <button class="btn btn-success" onclick="saveContent()">💾 Сохранить</button>
          <button class="btn btn-secondary" onclick="reloadContent()">🔄 Перезагрузить</button>
          <button class="btn btn-secondary" onclick="toggleHtmlMode()">⚡ HTML режим</button>
          <span id="currentFileName" style="margin-left: auto; color: var(--text-secondary);"></span>
        </div>
        
        <div class="editor-container">
          <div id="editor"></div>
        </div>
        
        <textarea id="htmlEditor" style="display: none; width: 100%; min-height: 500px; padding: 20px; background: #1e1e1e; color: #d4d4d4; border: none; border-radius: 12px; font-family: 'Fira Code', monospace; font-size: 14px; resize: vertical;"></textarea>
      </div>
    </main>
  </div>
  
  <div class="status-bar">
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Готов к работе</span>
    </div>
    <span id="lastSaved"></span>
  </div>
</div>

<!-- Backups Modal -->
<div class="modal-overlay" id="backupsModal">
  <div class="modal">
    <h2>📦 Резервные копии</h2>
    <div class="backup-list" id="backupList">
      <div class="loading"><div class="spinner"></div></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeBackupsModal()">Закрыть</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
const API_URL = 'admin-api.php';

let quill = null;
let currentFile = null;
let originalContent = '';
let isHtmlMode = false;
let hasUnsavedChanges = false;

// Initialize Quill
function initQuill() {
  quill = new Quill('#editor', {
    theme: 'snow',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'color': [] }, { 'background': [] }],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['blockquote', 'code-block'],
        ['link', 'image'],
        [{ 'align': [] }],
        ['clean']
      ]
    },
    placeholder: 'Начните редактирование...'
  });
  
  quill.on('text-change', () => {
    hasUnsavedChanges = true;
    updateStatus('Есть несохранённые изменения', true);
  });
}

// API Functions
async function apiCall(action, data = {}, method = 'GET') {
  const url = new URL(API_URL, window.location.href);
  
  if (method === 'GET') {
    url.searchParams.append('action', action);
    Object.keys(data).forEach(key => url.searchParams.append(key, data[key]));
    
    const response = await fetch(url);
    return response.json();
  } else {
    const formData = new FormData();
    formData.append('action', action);
    Object.keys(data).forEach(key => formData.append(key, data[key]));
    
    const response = await fetch(API_URL, {
      method: 'POST',
      body: formData
    });
    return response.json();
  }
}

// Auth Functions
async function checkAuth() {
  const result = await apiCall('check_auth');
  if (result.authenticated) {
    showAdminPanel();
  }
}

async function login(e) {
  e.preventDefault();
  const password = document.getElementById('password').value;
  
  const result = await apiCall('login', { password }, 'POST');
  
  if (result.success) {
    showAdminPanel();
    showToast('Добро пожаловать!', 'success');
  } else {
    document.getElementById('loginError').textContent = result.message;
    document.getElementById('loginError').style.display = 'block';
  }
}

async function logout() {
  if (hasUnsavedChanges && !confirm('Есть несохранённые изменения. Выйти?')) {
    return;
  }
  
  await apiCall('logout', {}, 'POST');
  location.reload();
}

function showAdminPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  initQuill();
  loadFiles();
}

// File Functions
async function loadFiles() {
  const result = await apiCall('get_files');
  
  if (result.success) {
    const fileList = document.getElementById('fileList');
    fileList.innerHTML = '';
    
    result.files.forEach(file => {
      const li = document.createElement('li');
      li.className = 'file-item';
      li.onclick = () => loadFile(file.name);
      li.innerHTML = `
        <span class="file-icon">📄</span>
        <div class="file-info">
          <div class="file-name">${file.name}</div>
          <div class="file-date">${file.modified}</div>
        </div>
      `;
      fileList.appendChild(li);
    });
  }
}

async function loadFile(filename) {
  if (hasUnsavedChanges && !confirm('Есть несохранённые изменения. Продолжить?')) {
    return;
  }
  
  updateStatus('Загрузка...', false);
  
  const result = await apiCall('get_content', { file: filename });
  
  if (result.success) {
    currentFile = filename;
    originalContent = result.content;
    
    // Update UI
    document.getElementById('editorPlaceholder').style.display = 'none';
    document.getElementById('editorWrapper').style.display = 'block';
    document.getElementById('currentFileName').textContent = filename;
    
    // Set content in Quill
    quill.root.innerHTML = result.content;
    document.getElementById('htmlEditor').value = result.content;
    
    // Update file list active state
    document.querySelectorAll('.file-item').forEach(item => {
      item.classList.remove('active');
      if (item.querySelector('.file-name').textContent === filename) {
        item.classList.add('active');
      }
    });
    
    hasUnsavedChanges = false;
    updateStatus('Файл загружен', false);
    showToast(`Загружен: ${filename}`, 'info');
  } else {
    showToast(result.error || 'Ошибка загрузки', 'error');
  }
}

async function saveContent() {
  if (!currentFile) return;
  
  updateStatus('Сохранение...', false);
  
  const content = isHtmlMode 
    ? document.getElementById('htmlEditor').value 
    : quill.root.innerHTML;
  
  const result = await apiCall('save_content', {
    file: currentFile,
    content: content
  }, 'POST');
  
  if (result.success) {
    hasUnsavedChanges = false;
    originalContent = content;
    updateStatus('Сохранено', false);
    document.getElementById('lastSaved').textContent = `Сохранено: ${new Date().toLocaleTimeString()}`;
    showToast('Файл успешно сохранён!', 'success');
  } else {
    showToast(result.error || 'Ошибка сохранения', 'error');
  }
}

function reloadContent() {
  if (currentFile) {
    loadFile(currentFile);
  }
}

function toggleHtmlMode() {
  isHtmlMode = !isHtmlMode;
  
  const editorContainer = document.querySelector('.editor-container');
  const htmlEditor = document.getElementById('htmlEditor');
  
  if (isHtmlMode) {
    // Switch to HTML mode
    htmlEditor.value = quill.root.innerHTML;
    editorContainer.style.display = 'none';
    htmlEditor.style.display = 'block';
    showToast('Режим HTML включён', 'info');
  } else {
    // Switch back to WYSIWYG
    quill.root.innerHTML = htmlEditor.value;
    editorContainer.style.display = 'block';
    htmlEditor.style.display = 'none';
    showToast('Визуальный режим включён', 'info');
  }
}

function previewPage() {
  if (currentFile) {
    window.open(currentFile, '_blank');
  }
}

// Backups
async function showBackups() {
  document.getElementById('backupsModal').style.display = 'flex';
  
  const result = await apiCall('get_backups');
  const list = document.getElementById('backupList');
  
  if (result.success && result.backups.length > 0) {
    list.innerHTML = result.backups.map(b => `
      <div class="backup-item">
        <div>
          <strong>${b.name}</strong><br>
          <small>${b.date} · ${(b.size / 1024).toFixed(1)} KB</small>
        </div>
        <button class="btn btn-secondary" onclick="restoreBackup('${b.name}')">Восстановить</button>
      </div>
    `).join('');
  } else {
    list.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Нет резервных копий</p>';
  }
}

async function restoreBackup(filename) {
  if (!confirm(`Восстановить файл из резервной копии ${filename}?`)) return;
  
  const result = await apiCall('restore_backup', { backup: filename }, 'POST');
  
  if (result.success) {
    showToast(result.message, 'success');
    closeBackupsModal();
    if (currentFile) loadFile(currentFile);
  } else {
    showToast(result.error || 'Ошибка восстановления', 'error');
  }
}

function closeBackupsModal() {
  document.getElementById('backupsModal').style.display = 'none';
}

// UI Helpers
function updateStatus(text, unsaved) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').className = 'status-dot' + (unsaved ? ' unsaved' : '');
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${message}</span>`;
  container.appendChild(toast);
  
  setTimeout(() => toast.remove(), 4000);
}

// Keyboard Shortcuts
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 's') {
      e.preventDefault();
      saveContent();
    }
  }
});

// Warn before leaving with unsaved changes
window.addEventListener('beforeunload', (e) => {
  if (hasUnsavedChanges) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// Initialize
document.getElementById('loginForm').addEventListener('submit', login);
checkAuth();
</script>

</body>
</html>
